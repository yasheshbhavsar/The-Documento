services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ai_immigration
      POSTGRES_USER: ai_immigration
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localadmin
      MINIO_ROOT_PASSWORD: local_dev_only_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "-c", "/app/backend/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ai_immigration:local_dev_only@host.docker.internal:5432/ai_immigration}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - tools

volumes:
  postgres_data:
  minio_data:
