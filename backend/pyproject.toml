[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "workers*"]

[project]

name = "ai-immigration-api"
version = "0.1.0"
description = "AI Immigration backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13.0",
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "boto3>=1.34.0",
  "bcrypt>=4.0.0",
  "pyjwt>=2.8.0",
  "email-validator>=2.0.0",
  "rapidocr-onnxruntime>=1.2.0",
]




[tool.pytest.ini_options]
pythonpath = [".."]
