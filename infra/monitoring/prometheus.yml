global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "documento-backend-api"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "documento-api"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
